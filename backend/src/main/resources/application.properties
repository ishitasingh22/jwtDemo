debug=true
spring.application.name=jwtdemo
# ===================================================================
# APPLICATION INFO & SERVER SETTINGS
# ===================================================================
server.port=8080
server.servlet.context-path=/api/v1

# ===================================================================
# DATABASE CONFIGURATION (MySQL Example)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:jwtdemo

spring.datasource.username=root
spring.datasource.password=@IshitaS2206
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

# ===================================================================
# JPA & HIBERNATE SETTINGS
# ===================================================================
# Options: none, validate, update, create, create-drop
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
app.jwt.secret=BKLdh75Sd2xRP7ZhpJ0aCihgWiZKpTg9x2kr8IC9dRl
app.jwt.expiration-ms=3600000
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
://level.com.yourcompany.app=TRACE

# Save log file to disk
logging.file.name=logs/application.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===================================================================
# ACTUATOR & MONITORING (Spring Boot Actuator)
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===================================================================
# CUSTOM APPLICATION PROPERTIES (Injected via @Value)
# ===================================================================
app.upload.directory=/var/data/uploads
app.max-retry-attempts=3
